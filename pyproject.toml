# Tool configuration only: vidx is not a package yet. Test command: see tests/conftest.py.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: needs the real models (macOS, cached by `vidx setup`); run with -m real"]
