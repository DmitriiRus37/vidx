# The Linux/Windows engines for real, with small models: vidx setup, the backend tests (pytest -m real) and one
# whole run on a fixture. Nightly and on demand; downloads ~2 GB (torch, parakeet, GigaAM, tiny whisper, Vosk small).
name: smoke
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [review-fixes]  # temporary: the review fixes change setup and the device probes
permissions:
  contents: read
jobs:
  engines:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VIDX_HOME: ${{ github.workspace }}/../vidx-home
      VIDX_MODEL_WHISPER: tiny
      VIDX_MODEL_TURBO: tiny
      VIDX_VOSK_RU: vosk-model-small-ru-0.22
      VIDX_VOSK_EN: vosk-model-small-en-us-0.15
      VIDX_TEST_WHISPER_MODEL: tiny
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token stays out of .git/config
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.22"  # pinned like the actions; raise it deliberately
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install vidx (console script)
        shell: bash
        run: |
          uv tool install -e .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: vidx setup
        shell: bash
        run: |
          vidx setup --no-models | tee setup.out
          # every device probe must name a device: "unknown (...)" is a broken venv or probe script
          grep "^devices: " setup.out
          if grep -q "^devices: .*: unknown" setup.out; then exit 1; fi
      - name: backend tests with real models
        run: uv run --isolated --group test pytest -m real tests/test_real_engines.py -ra
      - name: a whole run (ru + en)
        shell: bash
        run: |
          vidx tests/fixtures/media/ru_en.m4a -l ru,en -o out -j 2
          grep -q "суп" out/transcript.txt
          grep -qi "soup" out/transcript.txt
          vidx tests/fixtures/media/ru_slides.mp4 -l ru -o slides -e whisper,apple 2> slides.log
          grep -q "Apple SpeechTranscriber: not available on this platform" slides.log
          grep -q "OCR" slides/ocr.md
      - name: keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: |
            out/*.md
            out/*.txt
            out/regions.json
            out/logs/
          if-no-files-found: ignore
